AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GitHub Actions OIDC deploy role for plastic-io graph-server (plan PB-125). Lets the
  graph-server repository deploy a configured environment without long-lived AWS keys.
  Manage this template through the account bootstrap pipeline. The application release
  workflow cannot create its own initial trust relationship. This role is substrate
  configuration, never touched by the application's IaC component (plan §4.10).
Parameters:
  GitHubOrg:
    Type: String
    Default: plastic-io
  GitHubRepo:
    Type: String
    Default: graph-server
  GitHubEnvironment:
    Type: String
    Default: dev
    Description: GitHub environment name. Restrict allowed deployment branches/tags in that environment.
  ServiceName:
    Type: String
    Default: plastic-io-graph-server
  Stage:
    Type: String
    Default: dev
  LayerPrefix:
    Type: String
    Default: plastic
    Description: Must match the release environment API_PREFIX.
  CreateProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider.
Conditions:
  MakeProvider: !Equals [!Ref CreateProvider, "true"]
Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]   # GitHub's published root thumbprint; AWS now validates the chain itself
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ServiceName}-github-deploy"
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubOidcProvider
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOrg}/${GitHubRepo}:environment:${GitHubEnvironment}"
      Policies:
        - PolicyName: serverless-deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: OwnStackOnly
                Effect: Allow
                Action:
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:ListStackResources
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                Resource:
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ServiceName}/*"
                  - !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${ServiceName}-auth/*"
              - Sid: DeploymentBucket
                Effect: Allow
                Action: [s3:CreateBucket, s3:GetBucketLocation, s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject, s3:PutBucketPolicy, s3:GetBucketPolicy, s3:DeleteBucketPolicy, s3:PutEncryptionConfiguration, s3:GetEncryptionConfiguration, s3:PutBucketVersioning, s3:GetBucketVersioning, s3:PutLifecycleConfiguration, s3:GetLifecycleConfiguration, s3:PutBucketAcl, s3:GetBucketAcl, s3:PutBucketTagging, s3:GetBucketTagging, s3:PutBucketPublicAccessBlock, s3:GetBucketPublicAccessBlock, s3:GetBucketOwnershipControls, s3:PutBucketOwnershipControls, s3:DeleteBucket]
                Resource:
                  - !Sub "arn:aws:s3:::${ServiceName}*"
                  - !Sub "arn:aws:s3:::${ServiceName}*/*"
              - Sid: FunctionsOfThisService
                Effect: Allow
                Action: [lambda:*]
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${ServiceName}-*"
              - Sid: LayersAndEventSourceReads
                Effect: Allow
                Action: [lambda:GetLayerVersion, lambda:ListLayerVersions]
                Resource: "*"
              - Sid: PublishOwnLayers
                Effect: Allow
                Action: [lambda:PublishLayerVersion, lambda:DeleteLayerVersion]
                Resource:
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${LayerPrefix}-${Stage}-*"
                  - !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:layer:${LayerPrefix}-${Stage}-*:*"
              # IDs are assigned by AWS, so these resources cannot be named before
              # their first deployment. The role is confined to this repo/environment.
              - Sid: ManageAuthentication
                Effect: Allow
                Action:
                  - cognito-idp:DescribeUserPool
                  - cognito-idp:UpdateUserPool
                  - cognito-idp:DeleteUserPool
                  - cognito-idp:TagResource
                  - cognito-idp:UntagResource
                  - cognito-idp:ListTagsForResource
                  - cognito-idp:CreateUserPoolClient
                  - cognito-idp:CreateManagedLoginBranding
                  - cognito-idp:DescribeManagedLoginBranding
                  - cognito-idp:DescribeManagedLoginBrandingByClient
                  - cognito-idp:UpdateManagedLoginBranding
                  - cognito-idp:DeleteManagedLoginBranding
                  - cognito-idp:DescribeUserPoolClient
                  - cognito-idp:UpdateUserPoolClient
                  - cognito-idp:DeleteUserPoolClient
                  - cognito-idp:CreateUserPoolDomain
                  - cognito-idp:UpdateUserPoolDomain
                  - cognito-idp:DeleteUserPoolDomain
                  - cognito-idp:CreateResourceServer
                  - cognito-idp:DescribeResourceServer
                  - cognito-idp:UpdateResourceServer
                  - cognito-idp:DeleteResourceServer
                Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"
              - Sid: CreatePool
                Effect: Allow
                Action: [cognito-idp:CreateUserPool, cognito-idp:DescribeUserPoolDomain]
                Resource: '*'
              - Sid: EditorHosting
                Effect: Allow
                Action:
                  - cloudfront:CreateDistribution
                  - cloudfront:GetDistribution
                  - cloudfront:GetDistributionConfig
                  - cloudfront:UpdateDistribution
                  - cloudfront:DeleteDistribution
                  - cloudfront:TagResource
                  - cloudfront:UntagResource
                  - cloudfront:ListTagsForResource
                  - cloudfront:CreateOriginAccessControl
                  - cloudfront:GetOriginAccessControl
                  - cloudfront:GetOriginAccessControlConfig
                  - cloudfront:UpdateOriginAccessControl
                  - cloudfront:DeleteOriginAccessControl
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: '*'
              - Sid: ApiGateway
                Effect: Allow
                Action: [apigateway:*]
                Resource:
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/restapis*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apis*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/apikeys*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/usageplans*"
                  - !Sub "arn:aws:apigateway:${AWS::Region}::/tags*"
              - Sid: LogGroupsOfThisService
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:DeleteLogGroup, logs:PutRetentionPolicy, logs:DeleteRetentionPolicy, logs:TagLogGroup, logs:TagResource, logs:ListTagsForResource]
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${ServiceName}-*"
              - Sid: TheLambdaExecutionRoleOnly
                Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:PutRolePolicy, iam:DeleteRolePolicy, iam:GetRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy, iam:TagRole, iam:UntagRole, iam:UpdateAssumeRolePolicy]
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-lambdaRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-oauthRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-iacWorkerRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-iacExecutionRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-iacStateMachineRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-iacGuardrailRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-applicationBridgeRole"
              - Sid: PassOnlyThatRoleToLambda
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-lambdaRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-oauthRole"
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com
              - Sid: ReadOnlyDescribes
                Effect: Allow
                Action: [cloudformation:ListStacks, cloudformation:ValidateTemplate, cloudformation:GetTemplateSummary, sts:GetCallerIdentity, logs:DescribeLogGroups]
                Resource: "*"
              - Sid: ManageIacWorkflow
                Effect: Allow
                Action: [states:CreateStateMachine, states:UpdateStateMachine, states:DeleteStateMachine, states:DescribeStateMachine, states:TagResource, states:UntagResource, states:ListTagsForResource]
                Resource: !Sub "arn:aws:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${ServiceName}-${Stage}-iac-review"
              - Sid: PassIacWorkerRole
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-iacWorkerRole"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-applicationBridgeRole"
                Condition:
                  StringEquals: {iam:PassedToService: lambda.amazonaws.com}
              - Sid: PassIacStateMachineRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/${ServiceName}-${Stage}-${AWS::Region}-iacStateMachineRole"
                Condition:
                  StringEquals: {iam:PassedToService: states.amazonaws.com}
              - Sid: McpClientRegistry
                Effect: Allow
                Action: [dynamodb:CreateTable, dynamodb:DescribeTable, dynamodb:UpdateTable, dynamodb:DeleteTable, dynamodb:TagResource, dynamodb:UntagResource, dynamodb:ListTagsOfResource, dynamodb:UpdateContinuousBackups, dynamodb:DescribeContinuousBackups, dynamodb:DescribeTimeToLive]
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${ServiceName}-${Stage}-oauth-clients"
Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
    Description: Put this in the repository variable AWS_DEPLOY_ROLE_ARN used by the deploy workflow.
