          route: $default

  httpDefault:
    handler: src/handler.defaultRoute
    # graph execution runs node code, which may ask to be contained
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 30
    events:
      - http:
          method: ANY
          path: /{proxy+}
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Execution-Id
              - X-Correlation-Id
              - X-Session-Id

resources:
  Resources:
    # What a client with no token is told (RFC 9728).  The authorizer refuses
    # before any handler runs, so this challenge cannot come from code — an
    # unauthorized request would otherwise get a bare 401 and an MCP client
    # would have nothing to discover.  The URL is absolute because a relative
    # one cannot be fetched.
    UnauthorizedGatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: '401'
        ResponseParameters:
          gatewayresponse.header.WWW-Authenticate: !Sub "'Bearer resource_metadata=\"https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/.well-known/oauth-protected-resource\"'"
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        ResponseTemplates:
          application/json: '{"error":"unauthenticated","code":"UNAUTHENTICATED"}'
    AccessDeniedGatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: '403'
        ResponseParameters:
          gatewayresponse.header.WWW-Authenticate: !Sub "'Bearer resource_metadata=\"https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/.well-known/oauth-protected-resource\"'"
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    StaticSite:
      Type: AWS::S3::Bucket
      Properties:
        AccessControl: Private
        BucketName: ${self:custom.s3Bucket}
        # Every graph document, projection and artifact is recoverable for 30 days
        # after an overwrite or delete (a poisoned CRDT log can be rolled back).
        VersioningConfiguration:
          Status: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: expire-noncurrent-versions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: 30
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
    # The streaming endpoint (plan PB-085).  Serverless 3.25 can declare a
    # Function URL but not its invoke mode, and the invoke mode is the whole
    # point: BUFFERED would hold every frame until the handler returned, which
    # for a subscription is until it times out.  So the URL is declared here.
    McpStreamUrl:
      Type: AWS::Lambda::Url
      Properties:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        TargetFunctionArn: !GetAtt McpStreamLambdaFunction.Arn
        # No Cors block: a Function URL that configures CORS adds the headers
        # itself, and the handler adds them too (it has to — the dev server is
        # the same code with no URL in front of it), which leaves a browser with
        # two Access-Control-Allow-Origin headers and a refusal.  One place owns
        # them, and it is the handler.  It answers the preflight as well.
    # AuthType NONE means the URL is reachable; it does not mean the endpoint is
    # open.  Every request must carry an Auth0 bearer, which the handler
    # verifies before it serves anything (src/mcp/stream.ts).
    #
    # Two statements, not one: since October 2025 a function URL needs
    # lambda:InvokeFunction as well as lambda:InvokeFunctionUrl, and a URL with
    # only the second answers every request with 403 before the function is ever
    # invoked.  InvokedViaFunctionUrl keeps the second statement to calls that
    # came through the URL, so this does not quietly make the function callable
    # by anyone through the Invoke API.
    McpStreamUrlPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt McpStreamLambdaFunction.Arn
        Action: lambda:InvokeFunctionUrl
        Principal: "*"
        FunctionUrlAuthType: NONE
    McpStreamInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt McpStreamLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: "*"
        InvokedViaFunctionUrl: true
  Outputs:
    McpStreamUrl:
      Description: MCP subscriptions/listen endpoint (response streaming)
      Value: !GetAtt McpStreamUrl.FunctionUrl
    Prefix:
      Value: ${self:custom.prefix}
