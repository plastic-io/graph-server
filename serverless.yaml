service: ${env:SERVICE_NAME, 'plastic-io-graph-server'}
plugins:
  - serverless-webpack
provider:
  name: aws
  # nodejs22.x: the MCP SDK v2 needs Node 20+ and isolated-vm (M3) needs 22+ (plan Q-5)
  runtime: nodejs22.x
  versionFunctions: false
  stackName: ${self:service}
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-1'}
  iamRoleStatements:
    - Effect: Allow
      Action: lambda:InvokeFunction
      Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-iacDiagnostics'
    - Effect: Allow
      Action: lambda:InvokeFunction
      Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-iacWorker'
    - Effect: Allow
      Action: lambda:InvokeFunction
      Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-applicationBridge'
    - Fn::If:
        - IacReviewEnabled
        - Effect: Allow
          Action: states:StartExecution
          Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${self:service}-${self:provider.stage}-iac-review'
        - !Ref AWS::NoValue
    - Fn::If:
        - CognitoMcpEnabled
        - Effect: Allow
          Action: dynamodb:GetItem
          Resource: !GetAtt CognitoMcpClients.Arn
        - !Ref AWS::NoValue
    - Effect: Allow
      Action:
        - lambda:GetLayerVersion
      Resource:
        - "arn:aws:lambda:${self:provider.region}:553035198032:layer:git-lambda2:8"
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource:
        - "arn:aws:s3:::${self:custom.s3Bucket}/*"
    - Effect: Allow
      Action:
        - s3:ListBucket
      Resource:
        - "arn:aws:s3:::${self:custom.s3Bucket}"
    - Effect: Allow
      Action:
        - "execute-api:ManageConnections"
      Resource:
        - "arn:aws:execute-api:*:*:**/@connections/*"
    # Work that outlives one call is handed to the worker below (plan §5.0).
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - "arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-taskWorker"
    # Asking CloudFormation what a change would do (plan §4.9, M4a).  Three
    # calls about a change set and no fourth: without ExecuteChangeSet — and
    # without iam:PassRole, which executing one would need — this role can
    # describe a change and cannot make it happen.  Scoped to the stacks this
    # environment names, so it cannot read or touch the substrate's own stack.
    - Effect: Allow
      Action:
        - cloudformation:CreateChangeSet
        - cloudformation:DescribeChangeSet
        - cloudformation:DeleteChangeSet
        - cloudformation:DescribeStacks
      Resource:
        - "arn:aws:cloudformation:${self:provider.region}:${aws:accountId}:stack/${opt:iacStackPrefix, 'pio-dev-'}*/*"
    # The browser that photographs a page lives in a function of its own, so
    # that every other call does not pay for a 67MB layer it will never use.
    - Effect: Allow
      Action:
        - lambda:InvokeFunction
      Resource:
        - "arn:aws:lambda:${self:provider.region}:*:function:${self:service}-${self:provider.stage}-screenshot"
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:OPENAI_API_KEY-*"
  # Identity (plan §4.4, M1): every HTTP route and the WebSocket $connect route are
  # behind the selected provider's JWT authorizer below. Later
  # WebSocket messages are attributed by the connection record written at $connect.
  # WebSocket execution stays off unless explicitly enabled.
  environment:
    AUTH_PROVIDER: ${env:AUTH_PROVIDER, 'auth0'}
    COGNITO_ISSUER: ${env:COGNITO_ISSUER, ''}
    COGNITO_CLIENT_IDS: ${env:COGNITO_CLIENT_IDS, ''}
    COGNITO_MACHINE_CLIENT_IDS: ${env:COGNITO_MACHINE_CLIENT_IDS, ''}
    COGNITO_REQUIRED_SCOPES: ${env:COGNITO_REQUIRED_SCOPES, ''}
    COGNITO_SCOPE_MAP: ${env:COGNITO_SCOPE_MAP, '{}'}
    COGNITO_RESOURCE_AUDIENCE: ${env:COGNITO_RESOURCE_AUDIENCE, ''}
    COGNITO_MCP_REGISTRATION: ${env:COGNITO_MCP_REGISTRATION, 'false'}
    COGNITO_LOGIN_DOMAIN: ${env:COGNITO_LOGIN_DOMAIN, ''}
    COGNITO_MCP_CLIENT_TABLE: !If [CognitoMcpEnabled, !Ref CognitoMcpClients, '']
    COGNITO_MCP_RESOURCE: !If [CognitoMcpEnabled, !Ref CognitoMcpResourceServer, '']
    COGNITO_MCP_OAUTH_ISSUER: !If [CognitoMcpEnabled, !GetAtt CognitoMcpOAuthUrl.FunctionUrl, '']
    AUTH0_DOMAIN: ${opt:auth0Domain, env:AUTH0_DOMAIN, 'dev-7q-g69up.us.auth0.com'}
    AUTH0_AUDIENCE: ${opt:auth0Audience, env:AUTH0_AUDIENCE, 'plastic-io-graph-server'}
    # The resource identifier an MCP client asks for a token for (RFC 8707).
    # It must be a URI and it must be an API identifier the authorization server
    # knows; tokens for it and for AUTH0_AUDIENCE are both accepted, so one can
    # be introduced without the other stopping.  Unset, the canonical /mcp URL
    # is advertised, which only works once an Auth0 API carries that identifier.
    # Left empty on purpose: the identifier is then derived from the host the
    # client actually reached, which is what an MCP client checks it against —
    # it refuses a resource that is not the server it is talking to.  Set it
    # only to a hostname this API really answers on.
    MCP_RESOURCE: ${opt:mcpResource, ''}
    # The API identifier the authorization server issues tokens for.  Unlike the
    # resource above it is an opaque string: it does not have to be a hostname
    # anything answers on, and it is accepted whatever the metadata advertises.
    MCP_AUDIENCE: ${opt:mcpAudience, 'https://graph-server.plastic-io.dev'}
    # What infrastructure this environment allows (plan §4.9, M4a).  With no
    # accounts named there is no CloudFormation client at all, so the server
    # validates a desired state and says plainly that it cannot plan one; the
    # account this would point at is decided with the orchestrator (D-45).
    # The account this stack is deployed into, which is the one it plans
    # against (D-45 resolved: the same account, scoped by the stack prefix).
    SERVICE_NAME: ${self:service}
    APPLICATION_BRIDGE_FUNCTION: ${self:service}-${self:provider.stage}-applicationBridge
    REQUIRE_CONTAINMENT: 'true'
    IAC_STACK_ISOLATION: ${env:IAC_STACK_ISOLATION, 'true'}
    IAC_DIAGNOSTICS_FUNCTION: ${self:service}-${self:provider.stage}-iacDiagnostics
    IAC_LIFECYCLE_FUNCTION: ${self:service}-${self:provider.stage}-iacWorker
    IAC_GUARDRAIL_REPAIR_FUNCTION: ${self:service}-${self:provider.stage}-iacGuardrailRepair
    PLATFORM_ADMIN_SUBS: ${env:PLATFORM_ADMIN_SUBS, ''}
    IAC_GUARDRAIL_ROLE_ARN: !If [IacReviewEnabled, !GetAtt IacGuardrailRole.Arn, '']
    IAC_WORKER_ROLE_ARN: !If [IacReviewEnabled, !GetAtt IacWorkerRole.Arn, '']
    COGNITO_USER_POOL_ARN: ${env:COGNITO_USER_POOL_ARN, ''}
    IAC_ACCOUNTS: ${opt:iacAccounts, '${aws:accountId}'}
    IAC_REVIEW_STATE_MACHINE: !If [IacReviewEnabled, !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${self:service}-${self:provider.stage}-iac-review', '']
    IAC_REGIONS: ${opt:iacRegions, 'us-west-1'}
    IAC_STACK_PREFIX: ${opt:iacStackPrefix, 'pio-dev-'}
    IAC_BOUNDARY_ARN: ${opt:iacBoundaryArn, ''}
    IAC_SUBSTRATE_STACKS: '${self:service},${self:service}-auth,plastic-io-iac-orchestrator'
    # Where this deployment answers, so a picture can be taken of what it serves.
    PUBLIC_BASE_URL: !Sub "https://${ApiGatewayRestApi}.execute-api.${self:provider.region}.amazonaws.com/${self:provider.stage}"
    # Anywhere else a picture may be taken of — an editor, usually.  Empty means
    # this deployment and nothing else.
    VIEW_ORIGINS: ${opt:viewOrigins, env:VIEW_ORIGINS, ''}
    SCREENSHOT_FUNCTION: ${self:service}-${self:provider.stage}-screenshot
    # An allow-list of resource types, because this runs in a personal account
    # and the expensive corners of AWS are many: empty means the careful
    # default (things that cost what they are used and nothing when idle).
    IAC_ALLOWED_TYPES: ${opt:iacAllowedTypes, ''}
    IAC_MAX_RESOURCES: ${opt:iacMaxResources, '100'}
    OWNER_SUBS: ${opt:ownerSubs, env:OWNER_SUBS, ''}
    WS_EXECUTION_ENABLED: ${opt:wsExecution, 'false'}
    API_REGION: ${self:provider.region}
    S3_BUCKET: ${self:custom.s3Bucket}
    STAGE: ${self:provider.stage}
    TASK_WORKER_FUNCTION: ${self:service}-${self:provider.stage}-taskWorker
    # How stale the JSON projection of a collaborative graph may get before an
    # edit refreshes it.  Graph execution and publishing read those files.
    CHECKPOINT_INTERVAL_MS: ${opt:checkpointInterval, '10000'}
    # Admission limits (plan PB-025): decoded update size, Yjs struct count per
    # update, and the per-principal brake on mutations and rejections per minute.
    MAX_UPDATE_BYTES: ${opt:maxUpdateBytes, '1048576'}
    MAX_STRUCTS: ${opt:maxStructs, '200000'}
    RATE_MAX_MUTATIONS: ${opt:rateMaxMutations, '600'}
    RATE_MAX_REJECTIONS: ${opt:rateMaxRejections, '30'}
    # warn (default) records drifted embedded component copies; reject refuses them
    COMPONENT_INTEGRITY: ${opt:componentIntegrity, 'warn'}
    # secret references node code may open through host.secret(ref): ref=SecretsManager name, comma separated (plan §4.5.4)
    SECRET_REFS: ${opt:secretRefs, 'openai=OPENAI_API_KEY'}
    # observation volume per execution before sampling kicks in (plan §4.7.4)
    MAX_OBSERVATIONS: ${opt:maxObservations, '5000'}
    # Where node code runs when neither the node nor the graph says (plan §4.6.3,
    # D-4).  `isolate` contains every node in its own V8 isolate; `worker` keeps
    # the 2.0 realm, which still has the Lambda's ambient authority, so a node
    # that asks for containment always gets it whatever this says.
    DEFAULT_CONTAINMENT: ${opt:defaultContainment, 'worker'}
    ISOLATE_TIMEOUT_MS: ${opt:isolateTimeoutMs, '10000'}
    ISOLATE_MEMORY_MB: ${opt:isolateMemoryMb, '128'}
    # browsers that may call /mcp directly (non-browser MCP clients send no Origin)
    MCP_ALLOWED_ORIGINS: ${opt:mcpAllowedOrigins, env:MCP_ALLOWED_ORIGINS, 'http://localhost:8080,http://localhost:5173,https://plastic-io.github.io'}
    # Where subscriptions/listen is served.  It is set by hand after the first
    # deploy (the stack output McpStreamUrl): reading it from the URL resource
    # here would make every function depend on a resource that depends on them.
    MCP_STREAM_URL: ${opt:mcpStreamUrl, ''}
    # How long one subscription stream is held open before the client is asked
    # to listen again, and how often the store is asked what changed.
    MCP_STREAM_MAX_MS: ${opt:mcpStreamMaxMs, '840000'}
    MCP_STREAM_POLL_MS: ${opt:mcpStreamPollMs, '2000'}
    NODE_OPTIONS: "--enable-source-maps --unhandled-rejections=warn"

  websocketsApiName: "${self:custom.prefix}-${self:provider.stage}-plastic-ws"

layers:
  chromium:
    path: layers/chromium
    name: ${self:custom.prefix}-${self:provider.stage}-chromium
    description: chromium and playwright-core, for the function that photographs a page (PB-149)
  isolatedVm:
    path: layers/isolated-vm
    name: ${self:custom.prefix}-${self:provider.stage}-isolated-vm
    # compatibleRuntimes is left out on purpose: this serverless version's schema
    # predates nodejs22.x and refuses it, and the field is only metadata.
    description: isolated-vm 6.2.0 built against the Lambda Node 22 image (webpack cannot bundle a .node binary)
    package:
      patterns:
        - '!Dockerfile'
        - '!build.sh'

custom:
  prefix: ${opt:prefix, env:API_PREFIX, 'plastic'}
  s3Bucket: ${self:service}
  jwtAuthorizer:
    name: authorizer
    type: request
    identitySource: method.request.header.Authorization
    resultTtlInSeconds: 0

functions:
  # JWT authorizer shared by the REST API and the WebSocket handshake
  authorizer:
    handler: src/handler.authorize
    timeout: 10

  # RFC 9728 protected-resource metadata: public, so clients can discover the audience
  protectedResourceMetadata:
    handler: src/handler.protectedResourceMetadata
    timeout: 6
    events:
      - http:
          method: GET
          path: /.well-known/oauth-protected-resource
          cors:
            origin: '*'

  # Provider-selected OAuth metadata and automatic public-client registration.
  # This function has no graph permissions and returns 404 in Auth0 deployments.
  oauth:
    handler: src/oauthHandler.handler
    timeout: 15
    reservedConcurrency: 2
    role: !If [CognitoMcpEnabled, !GetAtt CognitoMcpRegistrationRole.Arn, !GetAtt IamRoleLambdaExecution.Arn]
    environment:
      # The OAuth function obtains its issuer from AWS's trusted request context.
      COGNITO_MCP_OAUTH_ISSUER: ''

  # manage connection and disconnection of clients
  connect:
    handler: src/handler.connect
    events:
      - websocket:
          route: $connect
          authorizer:
            name: authorizer
            identitySource:
              - route.request.header.Sec-WebSocket-Protocol

  disconnect:
    handler: src/handler.disconnect
    events:
      - websocket:
          route: $disconnect

  chat:
    handler: src/handler.chat
    timeout: 29
    events:
      - websocket:
          route: chat

  subscribe:
    handler: src/handler.subscribe
    events:
      - websocket:
          route: subscribe

  unsubscribe:
    handler: src/handler.unsubscribe
    events:
      - websocket:
          route: unsubscribe

  graphWs:
    handler: src/handler.getGraphWs
    events:
      - websocket:
          route: getGraph

  publishNodeWs:
    handler: src/handler.publishNodeWs
    timeout: 30
    events:
      - websocket:
          route: publishNode

  publishGraphWs:
    handler: src/handler.publishGraphWs
    timeout: 30
    events:
      - websocket:
          route: publishGraph

  deleteGraphWs:
    handler: src/handler.deleteGraphWs
    timeout: 30
    events:
      - websocket:
          route: deleteGraph

  events:
    handler: src/handler.getEvents
    timeout: 30
    events:
      - http:
          method: GET
          path: /events/{id}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  artifact:
    handler: src/handler.getArtifact
    timeout: 30
    events:
      - http:
          method: GET
          path: /artifacts/{id}/{version}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  graph:
    handler: src/handler.getGraph
    timeout: 30
    events:
      - http:
          method: GET
          path: /graph/{id}/{version}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  toc:
    handler: src/handler.getToc
    timeout: 30
    events:
      - http:
          method: GET
          path: /toc.json
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  # Deleting hides a graph and keeps everything it is made of.  Passing
  # ?permanent=true destroys it instead, which is a debugging tool: the events,
  # the projections, the endpoint and the collaborative document all go, and
  # none of it comes back.
  deleteGraph:
    handler: src/handler.deleteGraph
    timeout: 30
    events:
      - http:
          method: DELETE
          path: /graph/{id}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
               querystrings:
                 permanent: false
          cors:
            origin: '*'

  undeleteGraph:
    handler: src/handler.undeleteGraph
    timeout: 30
    events:
      - http:
          method: POST
          path: /graph/{id}/restore
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  # The list of graphs as a document update, so a caller can fetch only what
  # changed since it last looked rather than the whole list.
  tocState:
    handler: src/handler.getTocState
    timeout: 30
    events:
      - http:
          method: GET
          path: /toc/state
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               querystrings:
                 sv: false
          cors:
            origin: '*'

  # Rebuild the list from the stored projections.  A repair tool: it is the
  # expensive walk that the list exists to avoid doing on every write.
  tocRebuild:
    handler: src/handler.rebuildToc
    timeout: 300
    events:
      - http:
          method: POST
          path: /toc/rebuild
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  deletedGraphs:
    handler: src/handler.listDeletedGraphs
    timeout: 30
    events:
      - http:
          method: GET
          path: /deleted.json
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  undeleteGraphWs:
    handler: src/handler.undeleteGraphWs
    timeout: 30
    events:
      - websocket:
          route: undeleteGraph

  # ---- collaborative editing (Yjs) ----
  # The write path never reads the graph: an update is appended to its own S3
  # object and fanned out, so concurrent edits cannot overwrite each other.
  crdtSync:
    handler: src/handler.crdtSync
    timeout: 30
    events:
      - websocket:
          route: yjs

  crdtState:
    handler: src/handler.crdtState
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/state
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtStateAt:
    handler: src/handler.crdtStateAt
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/state/{updateId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 updateId: true
          cors:
            origin: '*'

  crdtHistory:
    handler: src/handler.crdtHistory
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/history
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtUpdate:
    handler: src/handler.crdtUpdate
    timeout: 30
    events:
      - http:
          method: POST
          path: /crdt/{id}/update
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  revisionsList:
    handler: src/handler.revisionsList
    timeout: 60
    events:
      - http:
          method: GET
          path: /crdt/{id}/revisions
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  revisionsCut:
    handler: src/handler.revisionsCut
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/revisions
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  revisionGet:
    handler: src/handler.revisionGet
    timeout: 60
    events:
      - http:
          method: GET
          path: /crdt/{id}/revisions/{revisionId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 revisionId: true
          cors:
            origin: '*'

  revisionActivate:
    handler: src/handler.revisionActivate
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/revisions/{revisionId}/activate
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 revisionId: true
          cors:
            origin: '*'

  revisionRestore:
    handler: src/handler.revisionRestore
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/revisions/{revisionId}/restore
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 revisionId: true
          cors:
            origin: '*'

  publish:
    handler: src/handler.publish
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/publish
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  componentsList:
    handler: src/handler.componentsList
    timeout: 60
    events:
      - http:
          method: GET
          path: /components/{id}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  # Who carries this component, and what publishing a version would mean for
  # them (PB-044).  A literal segment beats the {version} parameter below, so
  # /components/{id}/consumers reaches this rather than asking for a version
  # called "consumers".
  componentConsumers:
    handler: src/handler.componentConsumers
    timeout: 60
    events:
      - http:
          method: GET
          path: /components/{id}/consumers
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  # The index is written as changes are accepted, so a graph nobody has edited
  # since it existed is missing from it.  This rebuilds it from the graphs
  # themselves; it is derived data, so it can be run whenever it is doubted.
  componentConsumersRebuild:
    handler: src/handler.componentConsumersRebuild
    timeout: 300
    events:
      - http:
          method: POST
          path: /components/consumers/rebuild
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  componentGet:
    handler: src/handler.componentGet
    timeout: 60
    events:
      - http:
          method: GET
          path: /components/{id}/{version}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  # MCP (plan §5, D-3): one POST per request on the REST API; the authorizer establishes the
  # principal, the SDK's per-request handler serves tools and resources through the same
  # services the editor uses.  Preflight is answered by API Gateway's CORS config.
  mcpRoute:
    handler: src/handler.mcpRoute
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 29
    environment:
      # So a client that arrives here is told where to listen.  Only this
      # function refers to the URL: putting it in the shared environment would
      # make the streaming function depend on a resource that depends on it.
      MCP_STREAM_URL: !GetAtt McpStreamUrl.FunctionUrl
    events:
      - http:
          method: POST
          path: /mcp
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - MCP-Protocol-Version
              - Mcp-Method
              - Mcp-Name
              - Mcp-Session-Id

  # subscriptions/listen (plan PB-085, spike S-3): a long-lived stream cannot be
  # served by API Gateway, which has 29 seconds and one response per request, so
  # this function is reached through a Lambda Function URL invoked with response
  # streaming (RESPONSE_STREAM, declared under resources: below because this
  # Serverless version predates the property).  No authorizer stands in front of
  # a Function URL: the handler verifies the selected provider's bearer itself.
  mcpStream:
    handler: src/handler.mcpStream
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 900
    memorySize: 512

  edgeDeliver:
    handler: src/handler.edgeDeliver
    # one node of a browser-owned execution, run here (plan §4.8.2)
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 30
    events:
      - http:
          method: POST
          path: /crdt/{id}/deliveries
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  taskWorker:
    handler: src/handler.taskWorker
    # the work of a task (plan §5.0, PB-084): invoked by the MCP handler, never
    # by a person, with room to take longer than a protocol call may
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 300
    memorySize: 1024

  observationsQuery:
    handler: src/handler.observationsQuery
    # what crossed one wire, across the executions this graph kept (PB-114)
    events:
      - http:
          method: GET
          path: /crdt/{id}/observations
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  deliveriesPending:
    handler: src/handler.deliveriesPending
    # what is still waiting for a browser (plan §4.8.2, PB-073)
    events:
      - http:
          method: GET
          path: /crdt/{id}/deliveries/pending
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  deliveryClaim:
    handler: src/handler.deliveryClaim
    # a browser says it has taken one
    events:
      - http:
          method: POST
          path: /crdt/{id}/deliveries/claim
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  migrations:
    handler: src/handler.migrations
    timeout: 300
    events:
      - http:
          method: GET
          path: /migrations
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'
      - http:
          method: POST
          path: /migrations/run
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  autonomy:
    handler: src/handler.autonomy
    timeout: 30
    events:
      - http:
          method: GET
          path: /policy/autonomy
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'
      - http:
          method: PUT
          path: /policy/autonomy
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  tests:
    handler: src/handler.tests
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/tests
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'
      - http:
          method: POST
          path: /crdt/{id}/tests
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  test:
    handler: src/handler.test
    # a test runs the graph, so it may need the isolate layer
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/tests/{testId}/run
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 testId: true
          cors:
            origin: '*'
      - http:
          method: GET
          path: /crdt/{id}/tests/{testId}/runs
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 testId: true
          cors:
            origin: '*'
      - http:
          method: DELETE
          path: /crdt/{id}/tests/{testId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 testId: true
          cors:
            origin: '*'

  journeys:
    handler: src/handler.journeys
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/journeys
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'
      - http:
          method: POST
          path: /crdt/{id}/journeys
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  journey:
    handler: src/handler.journey
    # a journey runs the graph, so it may need the isolate layer
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 60
    events:
      - http:
          method: GET
          path: /crdt/{id}/journeys/{journeyId}/runs
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 journeyId: true
          cors:
            origin: '*'
      - http:
          method: POST
          path: /crdt/{id}/journeys/{journeyId}/run
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 journeyId: true
          cors:
            origin: '*'
      - http:
          method: DELETE
          path: /crdt/{id}/journeys/{journeyId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 journeyId: true
          cors:
            origin: '*'

  journeyTick:
    handler: src/handler.journeyTick
    # nobody calls this: it is the schedule asking whether the application
    # still does what it is for (plan §8.1.7)
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 300
    events:
      - schedule:
          rate: rate(5 minutes)
          enabled: ${opt:journeys, 'true'}

  # What this graph deploys, and what became of it (plan §4.9, PB-094).  The
  # editor asks the same questions an agent asks.
  iacOverview:
    handler: src/handler.iacOverview
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/stacks
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  iac:
    handler: src/handler.iac
    timeout: 60
    events:
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 nodeId: true
          cors:
            origin: '*'
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/plan
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 nodeId: true
          cors:
            origin: '*'

  iacReview:
    handler: src/handler.iacReview
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}/inspect
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}/runtime-logs
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/recovery-plan
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/recovery-approve
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/maintenance
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/readiness
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}/events
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}/operations
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}/template
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: GET
          path: /crdt/{id}/iac/{nodeId}/review
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/apply
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}
      - http:
          method: POST
          path: /crdt/{id}/iac/{nodeId}/discard
          authorizer: ${self:custom.jwtAuthorizer}
          cors: {origin: '*'}

  applicationBridge:
    handler: src/applicationWorker.handler
    timeout: 30
    role: !GetAtt ApplicationBridgeRole.Arn

  iacDiagnostics:
    handler: src/iacDiagnostics.handler
    timeout: 30
    role: !GetAtt IacDiagnosticsRole.Arn

  iacWorker:
    handler: src/iacWorker.handler
    timeout: 60
    role: !If [IacReviewEnabled, !GetAtt IacWorkerRole.Arn, !GetAtt IamRoleLambdaExecution.Arn]
    environment:
      # The state machine targets this function. Construct its known ARN to
      # inspect executions without introducing a Lambda/StateMachine cycle.
      IAC_REVIEW_STATE_MACHINE: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:${self:service}-${self:provider.stage}-iac-review'
      IAC_EXECUTION_ROLE_ARN: !If [IacReviewEnabled, !GetAtt IacExecutionRole.Arn, '']

  iacGuardrailRepair:
    handler: src/iacGuardrailRepair.handler
    timeout: 30
    role: !GetAtt IacGuardrailRepairRole.Arn

  # A picture of what a graph serves (PB-149).  Nothing routes to it: the
  # protocol handler invokes it when somebody asks to look.
  screenshot:
    handler: src/screenshot.handler
    layers:
      - !Ref ChromiumLambdaLayer
    # chromium wants room; it is asleep the rest of the time
    memorySize: 2048
    timeout: 60

  executionsList:
    handler: src/handler.executionsList
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/executions
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'
      - http:
          method: GET
          path: /crdt/{id}/executions/{executionId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 executionId: true
          cors:
            origin: '*'

  executionIngest:
    handler: src/handler.executionIngest
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/executions
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  proposalsList:
    handler: src/handler.proposalsList
    timeout: 60
    events:
      - http:
          method: GET
          path: /crdt/{id}/proposals
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  proposalCreate:
    handler: src/handler.proposalCreate
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/proposals
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  proposalGet:
    handler: src/handler.proposalGet
    timeout: 60
    events:
      - http:
          method: GET
          path: /crdt/{id}/proposals/{proposalId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 proposalId: true
          cors:
            origin: '*'

  proposalValidate:
    handler: src/handler.proposalValidate
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/proposals/{proposalId}/validate
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 proposalId: true
          cors:
            origin: '*'

  proposalDecide:
    handler: src/handler.proposalDecide
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/proposals/{proposalId}/decide
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 proposalId: true
          cors:
            origin: '*'

  proposalCommit:
    handler: src/handler.proposalCommit
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/proposals/{proposalId}/commit
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
                 proposalId: true
          cors:
            origin: '*'

  auditList:
    handler: src/handler.auditList
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/audit
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  delegationsList:
    handler: src/handler.delegationsList
    timeout: 30
    events:
      - http:
          method: GET
          path: /policy/agents
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'

  delegationPut:
    handler: src/handler.delegationPut
    timeout: 30
    events:
      - http:
          method: PUT
          path: /policy/agents/{sub}/{graphId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 sub: true
                 graphId: true
          cors:
            origin: '*'

  delegationDelete:
    handler: src/handler.delegationDelete
    timeout: 30
    events:
      - http:
          method: DELETE
          path: /policy/agents/{sub}/{graphId}
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 sub: true
                 graphId: true
          cors:
            origin: '*'

  crdtCheckpoint:
    handler: src/handler.crdtCheckpoint
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/checkpoint
          authorizer: ${self:custom.jwtAuthorizer}
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  panic:
    handler: src/handler.panic
    timeout: 6
    events:
      - websocket:
          route: panic

  # all other routes are passed to graph execution
  default:
    handler: src/handler.defaultRoute
    layers:
      - arn:aws:lambda:${self:provider.region}:553035198032:layer:git-lambda2:8
      - !Ref IsolatedVmLambdaLayer
    timeout: 30
    events:
      - websocket:
          route: $default

  httpDefault:
    handler: src/handler.defaultRoute
    # graph execution runs node code, which may ask to be contained
    layers:
      - !Ref IsolatedVmLambdaLayer
    timeout: 30
    events:
      - http:
          method: ANY
          path: /{proxy+}
          authorizer: ${self:custom.jwtAuthorizer}
          cors:
            origin: '*'
            headers:
              - Content-Type
              - Authorization
              - X-Execution-Id
              - X-Correlation-Id
              - X-Session-Id

resources:
  Conditions:
    IacReviewEnabled: !Equals ['${env:IAC_REVIEW_ENABLED, "true"}', 'true']
    CognitoMcpEnabled: !And
      - !Equals ['${env:AUTH_PROVIDER, "auth0"}', cognito]
      - !Equals ['${env:COGNITO_MCP_REGISTRATION, "false"}', 'true']
  Resources:
    IacGuardrailRepairRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-iacGuardrailRepairRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
        Policies:
          - PolicyName: restore-only-approved-namespaced-guardrails
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [cloudformation:DescribeStacks, cloudformation:ListStackResources]
                  Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/graph-guardrails-*/*'
                - Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/reviews/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/review-index/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/stacks/*'
                - Effect: Allow
                  Action: [iam:GetRole, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:PutRolePolicy, iam:UpdateAssumeRolePolicy]
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/graph-deploy/gapp-*'
                - Effect: Allow
                  Action: iam:GetRole
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/graph-app/gapp-*'
                - Effect: Allow
                  Action: [iam:GetPolicy, iam:GetPolicyVersion, iam:ListPolicyVersions, iam:ListEntitiesForPolicy, iam:CreatePolicyVersion, iam:DeletePolicyVersion]
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/graph-guardrails/gapp-*'
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-iacGuardrailRepair:*'
    IacDiagnosticsRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-iacDiagnosticsRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: 'sts:AssumeRole'}]
        Policies:
          - PolicyName: read-operation-diagnostics
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [cloudformation:DescribeStacks, cloudformation:DescribeStackEvents, cloudformation:DescribeChangeSet]
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/gapp-*/*'
                    - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/graph-guardrails-*/*'
                    - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${opt:iacStackPrefix, "pio-dev-"}*/*'
                    - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/review-*/*'
                - Effect: Allow
                  Action: [states:DescribeExecution, states:GetExecutionHistory]
                  Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${self:service}-${self:provider.stage}-iac-review:*'
                - Effect: Allow
                  Action: logs:FilterLogEvents
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-iacWorker:*'
                - Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/reviews/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/connections/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/policy/agents/*'
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject]
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/progress/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/observations/watch/*'
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}'
                  Condition:
                    StringLike: {s3:prefix: ['subscriptions/graph-notify-*', 'iac/progress/*', 'observations/watch/*']}
                - Effect: Allow
                  Action: execute-api:ManageConnections
                  Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${self:provider.stage}/POST/@connections/*'
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-iacDiagnostics:*'
    IacDiagnosticWorkflowEvents:
      Type: AWS::Events::Rule
      Condition: IacReviewEnabled
      Properties:
        Name: ${self:service}-${self:provider.stage}-iac-diagnostics
        EventPattern:
          source: [aws.states]
          detail-type: [Step Functions Execution Status Change]
          detail:
            stateMachineArn: [!Ref IacReviewStateMachine]
            status: [FAILED, TIMED_OUT, ABORTED, SUCCEEDED]
        Targets:
          - Id: DeploymentDiagnostics
            Arn: !GetAtt IacDiagnosticsLambdaFunction.Arn
            RetryPolicy: {MaximumEventAgeInSeconds: 3600, MaximumRetryAttempts: 10}
    IacDiagnosticWorkflowPermission:
      Type: AWS::Lambda::Permission
      Condition: IacReviewEnabled
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Ref IacDiagnosticsLambdaFunction
        Principal: events.amazonaws.com
        SourceArn: !GetAtt IacDiagnosticWorkflowEvents.Arn
    ApplicationBridgeRole:
      Type: AWS::IAM::Role
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-applicationBridgeRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: lambda.amazonaws.com}
              Action: sts:AssumeRole
        Policies:
          - PolicyName: invoke-approved-application-functions
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: s3:GetObject
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/*'
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:gapp-*'
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-applicationBridge:*'
    IacGuardrailRole:
      Type: AWS::IAM::Role
      Condition: IacReviewEnabled
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-iacGuardrailRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: cloudformation.amazonaws.com}
              Action: sts:AssumeRole
        Policies:
          - PolicyName: provision-platform-guardrails
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                # IAM existence probes address absent roles without their path.
                # Missing-role inline-policy cleanup also probes root ARNs; only the assigned
                # guardrail template can request it. Existing foreign-path roles fail ownership checks.
                - Effect: Allow
                  Action: [iam:GetRole, iam:GetRolePolicy, iam:DeleteRolePolicy]
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gapp-*'
                - Effect: Allow
                  Action: [iam:CreateRole, iam:GetRole, iam:DeleteRole, iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy, iam:ListRolePolicies, iam:TagRole, iam:UntagRole, iam:UpdateAssumeRolePolicy]
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/graph-deploy/gapp-*'
                - Effect: Allow
                  Action: [iam:CreatePolicy, iam:GetPolicy, iam:GetPolicyVersion, iam:ListPolicyVersions, iam:CreatePolicyVersion, iam:DeletePolicyVersion, iam:DeletePolicy, iam:TagPolicy, iam:UntagPolicy, iam:ListPolicyTags]
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/graph-guardrails/gapp-*'
    IacExecutionRole:
      Type: AWS::IAM::Role
      Condition: IacReviewEnabled
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-iacExecutionRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: cloudformation.amazonaws.com}
              Action: sts:AssumeRole
        Policies:
          - PolicyName: prefixed-data-resources
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: ['s3:*']
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${opt:iacStackPrefix, "pio-dev-"}*'
                - Effect: Deny
                  Action: ['s3:*']
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:service}*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:service}*/*'
                - Effect: Allow
                  Action: ['dynamodb:*']
                  Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${opt:iacStackPrefix, "pio-dev-"}*'
                - Effect: Allow
                  Action: ['sqs:*']
                  Resource: !Sub 'arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:${opt:iacStackPrefix, "pio-dev-"}*'
                - Effect: Allow
                  Action: ['sns:*']
                  Resource: !Sub 'arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:${opt:iacStackPrefix, "pio-dev-"}*'
                - Effect: Allow
                  Action: ['logs:CreateLogGroup','logs:DeleteLogGroup','logs:PutRetentionPolicy','logs:DeleteRetentionPolicy','logs:TagResource','logs:UntagResource','logs:ListTagsForResource']
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${opt:iacStackPrefix, "pio-dev-"}*'
                - Effect: Allow
                  Action: logs:DescribeLogGroups
                  Resource: '*'
    IacWorkerRole:
      Type: AWS::IAM::Role
      Condition: IacReviewEnabled
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-iacWorkerRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: lambda.amazonaws.com}
              Action: sts:AssumeRole
        Policies:
          - PolicyName: reviewed-change-sets
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-iacDiagnostics'
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${self:provider.stage}-iacGuardrailRepair'
                - Effect: Allow
                  Action: s3:GetObject
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/connections/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/policy/agents/*'
                - Effect: Allow
                  Action: s3:ListBucket
                  Resource: !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}'
                  Condition:
                    StringLike: {s3:prefix: ['subscriptions/graph-notify-*', 'iac/*', 'observations/watch/*']}
                - Effect: Allow
                  Action: execute-api:ManageConnections
                  Resource: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${self:provider.stage}/POST/@connections/*'
                - Effect: Allow
                  Action: [s3:GetObject, s3:PutObject]
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/iac/*'
                    - !Sub 'arn:${AWS::Partition}:s3:::${self:custom.s3Bucket}/observations/watch/*'
                - Effect: Allow
                  Action: [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:DeleteChangeSet, cloudformation:ExecuteChangeSet, cloudformation:DescribeStacks]
                  Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${opt:iacStackPrefix, "pio-dev-"}*/*'
                - Effect: Deny
                  Action: ['cloudformation:*']
                  Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${self:service}*/*'
                - Effect: Allow
                  Action: iam:PassRole
                  Resource: !GetAtt IacExecutionRole.Arn
                  Condition:
                    StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}
                - Effect: Allow
                  Action: [cloudformation:CreateStack, cloudformation:UpdateStack, cloudformation:DeleteStack, cloudformation:DescribeStacks, cloudformation:TagResource, cloudformation:GetTemplate, cloudformation:ListStackResources, cloudformation:ContinueUpdateRollback, cloudformation:RollbackStack, cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet]
                  Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/graph-guardrails-*/*'
                - Effect: Allow
                  Action: iam:PassRole
                  Resource: !GetAtt IacGuardrailRole.Arn
                  Condition:
                    StringEquals: {iam:PassedToService: cloudformation.amazonaws.com}
                # Read-only inspection and logs are selected from the stored graph operation.
                - Effect: Allow
                  Action: [cloudformation:DescribeStacks, cloudformation:GetTemplate, cloudformation:ListStackResources]
                  Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/gapp-*/*'
                - Effect: Allow
                  Action: [cloudformation:CreateChangeSet, cloudformation:DescribeChangeSet, cloudformation:ExecuteChangeSet]
                  Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/recovery-gapp-*/*'
                - Effect: Allow
                  Action: [iam:GetRole, iam:GetRolePolicy, iam:ListRolePolicies, iam:ListAttachedRolePolicies]
                  Resource:
                    - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/graph-deploy/gapp-*'
                    - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/gapp-*'
                - Effect: Allow
                  Action: iam:GetRole
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/graph-app/gapp-*'
                - Effect: Allow
                  Action: [iam:GetRole, iam:GetRolePolicy]
                  Resource: !GetAtt IacGuardrailRole.Arn
                - Effect: Allow
                  Action: [iam:GetPolicy, iam:GetPolicyVersion, iam:ListEntitiesForPolicy]
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/graph-guardrails/gapp-*'
                - Effect: Allow
                  Action: states:DescribeExecution
                  Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:${self:service}-${self:provider.stage}-iac-review:*'
                - Effect: Allow
                  Action: logs:FilterLogEvents
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/gapp-*:*'
                - Effect: Allow
                  Action: sts:AssumeRole
                  Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/graph-deploy/gapp-*-worker'
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-iacWorker:*'
    IacStateMachineRole:
      Type: AWS::IAM::Role
      Condition: IacReviewEnabled
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-iacStateMachineRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: states.amazonaws.com}
              Action: sts:AssumeRole
              Condition:
                StringEquals: {aws:SourceAccount: !Ref AWS::AccountId}
        Policies:
          - PolicyName: invoke-isolated-worker
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: lambda:InvokeFunction
                  Resource: !GetAtt IacWorkerLambdaFunction.Arn
    IacReviewStateMachine:
      Type: AWS::StepFunctions::StateMachine
      Condition: IacReviewEnabled
      Properties:
        StateMachineName: ${self:service}-${self:provider.stage}-iac-review
        StateMachineType: STANDARD
        RoleArn: !GetAtt IacStateMachineRole.Arn
        Definition:
          StartAt: Step
          TimeoutSeconds: 21600
          States:
            Step:
              Type: Task
              Resource: !GetAtt IacWorkerLambdaFunction.Arn
              TimeoutSeconds: 65
              Retry:
                - ErrorEquals: [States.ALL]
                  IntervalSeconds: 5
                  BackoffRate: 2
                  MaxAttempts: 3
              Catch:
                - ErrorEquals: [States.ALL]
                  ResultPath: $.fatal
                  Next: RecordFailure
              Next: Finished
            Finished:
              Type: Choice
              Choices:
                - Variable: $.done
                  BooleanEquals: true
                  Next: Complete
              Default: Wait
            Wait:
              Type: Wait
              SecondsPath: $.waitSeconds
              Next: Step
            RecordFailure:
              Type: Task
              Resource: !GetAtt IacWorkerLambdaFunction.Arn
              TimeoutSeconds: 65
              Retry:
                - ErrorEquals: [States.ALL]
                  IntervalSeconds: 5
                  MaxAttempts: 3
              End: true
            Complete: {Type: Succeed}
    # MCP resource indicators and custom scopes must identify the same API URL.
    # This lives with the API so new environments need no precomputed API ID.
    CognitoMcpResourceServer:
      Type: AWS::Cognito::UserPoolResourceServer
      Condition: CognitoMcpEnabled
      Properties:
        UserPoolId: ${env:COGNITO_USER_POOL_ID, 'disabled'}
        Identifier: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/mcp'
        Name: ${self:service}-${self:provider.stage}-mcp
        Scopes:
          - {ScopeName: access, ScopeDescription: Access the graph MCP API}
          - {ScopeName: read, ScopeDescription: Read graphs through MCP}
          - {ScopeName: propose, ScopeDescription: Propose graph changes through MCP}
    CognitoMcpOAuthUrl:
      Type: AWS::Lambda::Url
      Condition: CognitoMcpEnabled
      Properties:
        AuthType: NONE
        TargetFunctionArn: !GetAtt OauthLambdaFunction.Arn
        Cors:
          AllowOrigins: ['*']
          AllowMethods: [GET, POST]
          AllowHeaders: [content-type]
    CognitoMcpOAuthUrlPermission:
      Type: AWS::Lambda::Permission
      Condition: CognitoMcpEnabled
      Properties:
        FunctionName: !GetAtt OauthLambdaFunction.Arn
        Action: lambda:InvokeFunctionUrl
        Principal: '*'
        FunctionUrlAuthType: NONE
    CognitoMcpOAuthInvokePermission:
      Type: AWS::Lambda::Permission
      Condition: CognitoMcpEnabled
      Properties:
        FunctionName: !GetAtt OauthLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: '*'
        InvokedViaFunctionUrl: true
    CognitoMcpClients:
      Type: AWS::DynamoDB::Table
      Condition: CognitoMcpEnabled
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${self:service}-${self:provider.stage}-oauth-clients
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions: [{AttributeName: id, AttributeType: S}]
        KeySchema: [{AttributeName: id, KeyType: HASH}]
        SSESpecification: {SSEEnabled: true}
        PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
    CognitoMcpRegistrationRole:
      Type: AWS::IAM::Role
      Condition: CognitoMcpEnabled
      Properties:
        RoleName: ${self:service}-${self:provider.stage}-${self:provider.region}-oauthRole
        AssumeRolePolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: {Service: lambda.amazonaws.com}
              Action: sts:AssumeRole
        Policies:
          - PolicyName: register-mcp-clients
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:UpdateItem]
                  Resource: !GetAtt CognitoMcpClients.Arn
                - Effect: Allow
                  Action: [cognito-idp:CreateUserPoolClient, cognito-idp:CreateManagedLoginBranding]
                  Resource: !Sub 'arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${env:COGNITO_USER_POOL_ID, "disabled"}'
                - Effect: Allow
                  Action: [logs:CreateLogStream, logs:PutLogEvents]
                  Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${self:service}-${self:provider.stage}-oauth:*'
    # What a client with no token is told (RFC 9728).  The authorizer refuses
    # before any handler runs, so this challenge cannot come from code — an
    # unauthorized request would otherwise get a bare 401 and an MCP client
    # would have nothing to discover.  The URL is absolute because a relative
    # one cannot be fetched.
    UnauthorizedGatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: UNAUTHORIZED
        StatusCode: '401'
        ResponseParameters:
          gatewayresponse.header.WWW-Authenticate: !Sub "'Bearer resource_metadata=\"https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/.well-known/oauth-protected-resource\"'"
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
        ResponseTemplates:
          application/json: '{"error":"unauthenticated","code":"UNAUTHENTICATED"}'
    AccessDeniedGatewayResponse:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: ACCESS_DENIED
        StatusCode: '403'
        ResponseParameters:
          gatewayresponse.header.WWW-Authenticate: !Sub "'Bearer resource_metadata=\"https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${self:provider.stage}/.well-known/oauth-protected-resource\"'"
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
    StaticSite:
      Type: AWS::S3::Bucket
      Properties:
        AccessControl: Private
        BucketName: ${self:custom.s3Bucket}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        # Every graph document, projection and artifact is recoverable for 30 days
        # after an overwrite or delete (a poisoned CRDT log can be rolled back).
        VersioningConfiguration:
          Status: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: expire-noncurrent-versions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: 30
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
    # The streaming endpoint (plan PB-085).  Serverless 3.25 can declare a
    # Function URL but not its invoke mode, and the invoke mode is the whole
    # point: BUFFERED would hold every frame until the handler returned, which
    # for a subscription is until it times out.  So the URL is declared here.
    McpStreamUrl:
      Type: AWS::Lambda::Url
      Properties:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        TargetFunctionArn: !GetAtt McpStreamLambdaFunction.Arn
        # No Cors block: a Function URL that configures CORS adds the headers
        # itself, and the handler adds them too (it has to — the dev server is
        # the same code with no URL in front of it), which leaves a browser with
        # two Access-Control-Allow-Origin headers and a refusal.  One place owns
        # them, and it is the handler.  It answers the preflight as well.
    # AuthType NONE means the URL is reachable; it does not mean the endpoint is
    # open. Every request must carry the selected provider's bearer, which the handler
    # verifies before it serves anything (src/mcp/stream.ts).
    #
    # Two statements, not one: since October 2025 a function URL needs
    # lambda:InvokeFunction as well as lambda:InvokeFunctionUrl, and a URL with
    # only the second answers every request with 403 before the function is ever
    # invoked.  InvokedViaFunctionUrl keeps the second statement to calls that
    # came through the URL, so this does not quietly make the function callable
    # by anyone through the Invoke API.
    McpStreamUrlPermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt McpStreamLambdaFunction.Arn
        Action: lambda:InvokeFunctionUrl
        Principal: "*"
        FunctionUrlAuthType: NONE
    McpStreamInvokePermission:
      Type: AWS::Lambda::Permission
      Properties:
        FunctionName: !GetAtt McpStreamLambdaFunction.Arn
        Action: lambda:InvokeFunction
        Principal: "*"
        InvokedViaFunctionUrl: true
  Outputs:
    GraphHttpUrl:
      Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${self:provider.stage}/'
    GraphWebSocketUrl:
      Value: !Sub 'wss://${WebsocketsApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${self:provider.stage}'
    GraphRestApiId:
      Value: !Ref ApiGatewayRestApi
    GraphWebSocketApiId:
      Value: !Ref WebsocketsApi
    McpStreamUrl:
      Description: MCP subscriptions/listen endpoint (response streaming)
      Value: !GetAtt McpStreamUrl.FunctionUrl
    Prefix:
      Value: ${self:custom.prefix}
