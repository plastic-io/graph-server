service: plastic-io-graph-server
plugins:
  - serverless-webpack
provider:
  name: aws
  runtime: nodejs18.x
  versionFunctions: false
  stackName: ${self:service}
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-1'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - lambda:GetLayerVersion
      Resource:
        - "arn:aws:lambda:${self:provider.region}:553035198032:layer:git-lambda2:8"
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource:
        - "arn:aws:s3:::${self:custom.s3Bucket}/*"
    - Effect: Allow
      Action:
        - s3:ListBucket
      Resource:
        - "arn:aws:s3:::${self:custom.s3Bucket}"
    - Effect: Allow
      Action:
        - "execute-api:ManageConnections"
      Resource:
        - "arn:aws:execute-api:*:*:**/@connections/*"
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - "arn:aws:secretsmanager:us-west-1:695527765921:secret:OPENAI_API_KEY-kcvByO"
  # Interim access control until the admission service lands (plan §4.4): the HTTP
  # execution route and the destructive/expensive HTTP routes require the stage API
  # key (x-api-key); WebSocket execution is off unless explicitly enabled.
  apiGateway:
    apiKeys:
      - ${self:service}-${self:provider.stage}-execute
    usagePlan:
      throttle:
        burstLimit: 20
        rateLimit: 10
  environment:
    WS_EXECUTION_ENABLED: ${opt:wsExecution, 'false'}
    API_REGION: ${self:provider.region}
    S3_BUCKET: ${self:custom.s3Bucket}
    STAGE: ${self:provider.stage}
    # How stale the JSON projection of a collaborative graph may get before an
    # edit refreshes it.  Graph execution and publishing read those files.
    CHECKPOINT_INTERVAL_MS: ${opt:checkpointInterval, '10000'}
    NODE_OPTIONS: "--enable-source-maps --unhandled-rejections=warn"

  websocketsApiName: "${self:custom.prefix}-${self:provider.stage}-plastic-ws"

custom:
  prefix: ${opt:prefix, 'plastic'}
  s3Bucket: ${self:service}

functions:
  # manage connection and disconnection of clients
  connect:
    handler: src/handler.connect
    events:
      - websocket:
          route: $connect

  disconnect:
    handler: src/handler.disconnect
    events:
      - websocket:
          route: $disconnect

  subscribe:
    handler: src/handler.subscribe
    events:
      - websocket:
          route: subscribe

  unsubscribe:
    handler: src/handler.unsubscribe
    events:
      - websocket:
          route: unsubscribe

  graphWs:
    handler: src/handler.getGraphWs
    events:
      - websocket:
          route: getGraph

  publishNodeWs:
    handler: src/handler.publishNodeWs
    timeout: 30
    events:
      - websocket:
          route: publishNode

  publishGraphWs:
    handler: src/handler.publishGraphWs
    timeout: 30
    events:
      - websocket:
          route: publishGraph

  deleteGraphWs:
    handler: src/handler.deleteGraphWs
    timeout: 30
    events:
      - websocket:
          route: deleteGraph

  events:
    handler: src/handler.getEvents
    timeout: 30
    events:
      - http:
          method: GET
          path: /events/{id}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  artifact:
    handler: src/handler.getArtifact
    timeout: 30
    events:
      - http:
          method: GET
          path: /artifacts/{id}/{version}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  graph:
    handler: src/handler.getGraph
    timeout: 30
    events:
      - http:
          method: GET
          path: /graph/{id}/{version}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  toc:
    handler: src/handler.getToc
    timeout: 30
    events:
      - http:
          method: GET
          path: /toc.json
          cors:
            origin: '*'

  # Deleting hides a graph and keeps everything it is made of.  Passing
  # ?permanent=true destroys it instead, which is a debugging tool: the events,
  # the projections, the endpoint and the collaborative document all go, and
  # none of it comes back.
  deleteGraph:
    handler: src/handler.deleteGraph
    timeout: 30
    events:
      - http:
          method: DELETE
          path: /graph/{id}
          private: true
          request:
            parameters:
               paths:
                 id: true
               querystrings:
                 permanent: false
          cors:
            origin: '*'

  undeleteGraph:
    handler: src/handler.undeleteGraph
    timeout: 30
    events:
      - http:
          method: POST
          path: /graph/{id}/restore
          private: true
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  # The list of graphs as a document update, so a caller can fetch only what
  # changed since it last looked rather than the whole list.
  tocState:
    handler: src/handler.getTocState
    timeout: 30
    events:
      - http:
          method: GET
          path: /toc/state
          request:
            parameters:
               querystrings:
                 sv: false
          cors:
            origin: '*'

  # Rebuild the list from the stored projections.  A repair tool: it is the
  # expensive walk that the list exists to avoid doing on every write.
  tocRebuild:
    handler: src/handler.rebuildToc
    timeout: 300
    events:
      - http:
          method: POST
          path: /toc/rebuild
          private: true
          cors:
            origin: '*'

  deletedGraphs:
    handler: src/handler.listDeletedGraphs
    timeout: 30
    events:
      - http:
          method: GET
          path: /deleted.json
          cors:
            origin: '*'

  undeleteGraphWs:
    handler: src/handler.undeleteGraphWs
    timeout: 30
    events:
      - websocket:
          route: undeleteGraph

  # ---- collaborative editing (Yjs) ----
  # The write path never reads the graph: an update is appended to its own S3
  # object and fanned out, so concurrent edits cannot overwrite each other.
  crdtSync:
    handler: src/handler.crdtSync
    timeout: 30
    events:
      - websocket:
          route: yjs

  crdtState:
    handler: src/handler.crdtState
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/state
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtStateAt:
    handler: src/handler.crdtStateAt
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/state/{updateId}
          request:
            parameters:
               paths:
                 id: true
                 updateId: true
          cors:
            origin: '*'

  crdtHistory:
    handler: src/handler.crdtHistory
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/history
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtUpdate:
    handler: src/handler.crdtUpdate
    timeout: 30
    events:
      - http:
          method: POST
          path: /crdt/{id}/update
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtCheckpoint:
    handler: src/handler.crdtCheckpoint
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/checkpoint
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  panic:
    handler: src/handler.panic
    timeout: 6
    events:
      - websocket:
          route: panic

  # all other routes are passed to graph execution
  default:
    handler: src/handler.defaultRoute
    layers:
      - arn:aws:lambda:${self:provider.region}:553035198032:layer:git-lambda2:8
    timeout: 30
    events:
      - websocket:
          route: $default

  httpDefault:
    handler: src/handler.defaultRoute
    timeout: 30
    events:
      - http:
          method: ANY
          path: /{proxy+}
          private: true
          cors:
            origin: '*'

resources:
  Resources:
    StaticSite:
      Type: AWS::S3::Bucket
      Properties:
        AccessControl: Private
        BucketName: ${self:custom.s3Bucket}
        # Every graph document, projection and artifact is recoverable for 30 days
        # after an overwrite or delete (a poisoned CRDT log can be rolled back).
        VersioningConfiguration:
          Status: Enabled
        LifecycleConfiguration:
          Rules:
            - Id: expire-noncurrent-versions
              Status: Enabled
              NoncurrentVersionExpiration:
                NoncurrentDays: 30
              AbortIncompleteMultipartUpload:
                DaysAfterInitiation: 7
  Outputs:
    Prefix:
      Value: ${self:custom.prefix}
