service: plastic-io-graph-server
plugins:
  - serverless-webpack
provider:
  name: aws
  runtime: nodejs18.x
  versionFunctions: false
  stackName: ${self:service}
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-west-1'}
  iamRoleStatements:
    - Effect: Allow
      Action:
        - lambda:GetLayerVersion
      Resource:
        - "arn:aws:lambda:${self:provider.region}:553035198032:layer:git-lambda2:8"
    - Effect: Allow
      Action:
        - s3:GetObject
        - s3:PutObject
        - s3:DeleteObject
      Resource:
        - "arn:aws:s3:::${self:custom.s3Bucket}/*"
    - Effect: Allow
      Action:
        - s3:ListBucket
      Resource:
        - "arn:aws:s3:::${self:custom.s3Bucket}"
    - Effect: Allow
      Action:
        - "execute-api:ManageConnections"
      Resource:
        - "arn:aws:execute-api:*:*:**/@connections/*"
    - Effect: Allow
      Action:
        - secretsmanager:GetSecretValue
      Resource:
        - "arn:aws:secretsmanager:us-west-1:695527765921:secret:OPENAI_API_KEY-kcvByO"
  environment:
    API_REGION: ${self:provider.region}
    S3_BUCKET: ${self:custom.s3Bucket}
    STAGE: ${self:provider.stage}
    # How stale the JSON projection of a collaborative graph may get before an
    # edit refreshes it.  Graph execution and publishing read those files.
    CHECKPOINT_INTERVAL_MS: ${opt:checkpointInterval, '10000'}
    NODE_OPTIONS: "--enable-source-maps --unhandled-rejections=warn"

  websocketsApiName: "${self:custom.prefix}-${self:provider.stage}-plastic-ws"

custom:
  prefix: ${opt:prefix, 'plastic'}
  s3Bucket: ${self:service}

functions:
  # manage connection and disconnection of clients
  connect:
    handler: src/handler.connect
    events:
      - websocket:
          route: $connect

  disconnect:
    handler: src/handler.disconnect
    events:
      - websocket:
          route: $disconnect

  subscribe:
    handler: src/handler.subscribe
    events:
      - websocket:
          route: subscribe

  unsubscribe:
    handler: src/handler.unsubscribe
    events:
      - websocket:
          route: unsubscribe

  sendToConnection:
    handler: src/handler.sendToConnection
    events:
      - websocket:
          route: sendToConnection

  sendToChannel:
    handler: src/handler.sendToChannel
    events:
      - websocket:
          route: sendToChannel

  broadcast:
    handler: src/handler.broadcast
    events:
      - websocket:
          route: broadcast

  # DEPRECATED: the pre-CRDT write path.  Kept so that an editor bundle still
  # cached on a CDN keeps working; nothing in the current editor calls it.
  addEvent:
    handler: src/handler.addEvent
    timeout: 30
    events:
      - websocket:
          route: addEvent
      - http:
          method: POST
          path: /addEvent
          cors:
            origin: '*'

  listSubscribers:
    handler: src/handler.listSubscribers
    events:
      - websocket:
          route: listSubscribers

  listSubscriptions:
    handler: src/handler.listSubscriptions
    events:
      - websocket:
          route: listSubscriptions

  graphWs:
    handler: src/handler.getGraphWs
    events:
      - websocket:
          route: getGraph

  publishNodeWs:
    handler: src/handler.publishNodeWs
    timeout: 30
    events:
      - websocket:
          route: publishNode

  publishGraphWs:
    handler: src/handler.publishGraphWs
    timeout: 30
    events:
      - websocket:
          route: publishGraph

  deleteGraphWs:
    handler: src/handler.deleteGraphWs
    timeout: 30
    events:
      - websocket:
          route: deleteGraph

  events:
    handler: src/handler.getEvents
    timeout: 30
    events:
      - http:
          method: GET
          path: /events/{id}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  artifact:
    handler: src/handler.getArtifact
    timeout: 30
    events:
      - http:
          method: GET
          path: /artifacts/{id}/{version}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  graph:
    handler: src/handler.getGraph
    timeout: 30
    events:
      - http:
          method: GET
          path: /graph/{id}/{version}
          request:
            parameters:
               paths:
                 id: true
                 version: true
          cors:
            origin: '*'

  toc:
    handler: src/handler.getToc
    timeout: 30
    events:
      - http:
          method: GET
          path: /toc.json
          cors:
            origin: '*'

  # Deleting hides a graph and keeps everything it is made of.  Passing
  # ?permanent=true destroys it instead, which is a debugging tool: the events,
  # the projections, the endpoint and the collaborative document all go, and
  # none of it comes back.
  deleteGraph:
    handler: src/handler.deleteGraph
    timeout: 30
    events:
      - http:
          method: DELETE
          path: /graph/{id}
          request:
            parameters:
               paths:
                 id: true
               querystrings:
                 permanent: false
          cors:
            origin: '*'

  undeleteGraph:
    handler: src/handler.undeleteGraph
    timeout: 30
    events:
      - http:
          method: POST
          path: /graph/{id}/restore
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  # The list of graphs as a document update, so a caller can fetch only what
  # changed since it last looked rather than the whole list.
  tocState:
    handler: src/handler.getTocState
    timeout: 30
    events:
      - http:
          method: GET
          path: /toc/state
          request:
            parameters:
               querystrings:
                 sv: false
          cors:
            origin: '*'

  # Rebuild the list from the stored projections.  A repair tool: it is the
  # expensive walk that the list exists to avoid doing on every write.
  tocRebuild:
    handler: src/handler.rebuildToc
    timeout: 300
    events:
      - http:
          method: POST
          path: /toc/rebuild
          cors:
            origin: '*'

  deletedGraphs:
    handler: src/handler.listDeletedGraphs
    timeout: 30
    events:
      - http:
          method: GET
          path: /deleted.json
          cors:
            origin: '*'

  undeleteGraphWs:
    handler: src/handler.undeleteGraphWs
    timeout: 30
    events:
      - websocket:
          route: undeleteGraph

  # ---- collaborative editing (Yjs) ----
  # The write path never reads the graph: an update is appended to its own S3
  # object and fanned out, so concurrent edits cannot overwrite each other.
  crdtSync:
    handler: src/handler.crdtSync
    timeout: 30
    events:
      - websocket:
          route: yjs

  crdtState:
    handler: src/handler.crdtState
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/state
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtStateAt:
    handler: src/handler.crdtStateAt
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/state/{updateId}
          request:
            parameters:
               paths:
                 id: true
                 updateId: true
          cors:
            origin: '*'

  crdtHistory:
    handler: src/handler.crdtHistory
    timeout: 30
    events:
      - http:
          method: GET
          path: /crdt/{id}/history
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtUpdate:
    handler: src/handler.crdtUpdate
    timeout: 30
    events:
      - http:
          method: POST
          path: /crdt/{id}/update
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  crdtCheckpoint:
    handler: src/handler.crdtCheckpoint
    timeout: 60
    events:
      - http:
          method: POST
          path: /crdt/{id}/checkpoint
          request:
            parameters:
               paths:
                 id: true
          cors:
            origin: '*'

  panic:
    handler: src/handler.panic
    timeout: 6
    events:
      - websocket:
          route: panic

  # all other routes are passed to graph execution
  default:
    handler: src/handler.defaultRoute
    layers:
      - arn:aws:lambda:${self:provider.region}:553035198032:layer:git-lambda2:8
    timeout: 30
    events:
      - websocket:
          route: $default

  httpDefault:
    handler: src/handler.defaultRoute
    timeout: 30
    events:
      - http:
          method: ANY
          path: /{proxy+}
          cors:
            origin: '*'

resources:
  Resources:
    StaticSite:
      Type: AWS::S3::Bucket
      Properties:
        AccessControl: Private
        BucketName: ${self:custom.s3Bucket}
  Outputs:
    Prefix:
      Value: ${self:custom.prefix}
