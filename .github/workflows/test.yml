name: Test

on:
  push:
    branches: [master]
  pull_request:

jobs:
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cfn-lint==1.57.1
      - run: cfn-lint -r us-west-1 -t infra/auth-environment.yaml infra/github-oidc-deploy-role.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      # Both repositories are checked out as siblings inside the workspace:
      # the CRDT package is linked from the editor by path
      # (file:../graph-editor/packages/GraphCrdt) until it is published to npm
      # (plan item PB-120), and actions/checkout refuses a path outside the
      # workspace, so the server lives in a subdirectory too.
      - uses: actions/checkout@v4
        with:
          path: graph-server
      - uses: actions/checkout@v4
        with:
          repository: plastic-io/graph-editor
          path: graph-editor
      - uses: actions/setup-node@v4
        with:
          node-version-file: graph-server/.nvmrc
      - run: npm ci
        working-directory: graph-server
      - name: Reject high or critical production dependency advisories
        run: npm audit --omit=dev --audit-level=high
        working-directory: graph-server
      - run: npx jest --ci
        working-directory: graph-server
      - run: npx tsc --noEmit && node --test scripts/ci/deployment-config.test.cjs
        working-directory: graph-server
      - name: Verify Auth0 and Cognito Lambda bundles
        run: node scripts/check-auth-builds.cjs
        working-directory: graph-server

  # The isolate addon is native and only matters where it will run, so the same
  # suite runs again inside the Lambda image (plan §8.1.4).
  containment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: graph-server
      - uses: actions/checkout@v4
        with:
          repository: plastic-io/graph-editor
          path: graph-editor
      - run: sh .github/docker-test.sh
        working-directory: graph-server
