name: Deploy (tagged release)

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      # Siblings inside the workspace: the CRDT package is linked from the
      # editor by path, and actions/checkout refuses a path outside it.
      - uses: actions/checkout@v4
        with:
          path: graph-server
      - uses: actions/checkout@v4
        with:
          repository: plastic-io/graph-editor
          path: graph-editor
      - uses: actions/setup-node@v4
        with:
          node-version-file: graph-server/.nvmrc
      - run: npm ci
        working-directory: graph-server
      - run: npx jest --ci
        working-directory: graph-server
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-1
      # package first: a failed webpack build exits 0 and produces no artifact, so a bare deploy can look like a success
      - run: npx serverless package --stage dev
        working-directory: graph-server
      - run: test -s .serverless/plastic-io-graph-server.zip
        working-directory: graph-server
      - run: npx serverless deploy --stage dev --package .serverless
        working-directory: graph-server
      # routes removed in this release would otherwise linger in the stage snapshot (see plan task 1 log)
      - run: |
          REST=$(aws apigateway get-rest-apis --query "items[?name=='dev-plastic-io-graph-server'].id" --output text)
          WS=$(aws apigatewayv2 get-apis --query "Items[?Name=='plastic-dev-plastic-ws'].ApiId" --output text)
          aws apigateway create-deployment --rest-api-id "$REST" --stage-name dev --description "post-deploy re-snapshot" >/dev/null
          aws apigatewayv2 create-deployment --api-id "$WS" --stage-name dev --description "post-deploy re-snapshot" >/dev/null
